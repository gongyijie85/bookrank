name: CI - Tests & Quality

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint:
    name: Code Quality (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff lint
        run: ruff check app/ tests/

      - name: Run Ruff format check
        run: ruff format --check app/ tests/

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run mypy
        run: mypy app/ --ignore-missing-imports

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-timeout

      - name: Run unit tests with coverage
        env:
          FLASK_ENV: testing
          SECRET_KEY: ci-test-secret-key
        run: |
          python -m pytest tests/ \
            -m "not slow" \
            --timeout=30 \
            --tb=short \
            -x \
            -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=70

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_BASE_URL: ${{ vars.RENDER_BASE_URL || 'https://bookrank-ckml.onrender.com' }}
        run: |
          set -euo pipefail

          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "ERROR: RENDER_DEPLOY_HOOK_URL is required for deployment."
            exit 1
          fi

          if [ -z "$RENDER_BASE_URL" ]; then
            echo "ERROR: RENDER_BASE_URL is required for readiness verification."
            exit 1
          fi

          curl --fail --show-error --silent --max-time 30 \
            -X POST "$RENDER_DEPLOY_HOOK_URL" -o /dev/null

          for attempt in $(seq 1 12); do
            if curl --fail --show-error --silent --max-time 30 \
              "$RENDER_BASE_URL/health/ready" -o /dev/null; then
              echo "Render deployment is ready."
              exit 0
            fi

            if [ "$attempt" -lt 12 ]; then
              echo "Render readiness check ${attempt}/12 failed; retrying in 15 seconds."
              sleep 15
            fi
          done

          echo "ERROR: Render deployment did not become ready after 12 checks."
          exit 1
