name: CI - Tests & Quality

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint:
    name: Code Quality (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff lint
        run: ruff check app/ tests/

      - name: Run Ruff format check
        run: ruff format --check app/ tests/

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run mypy
        run: mypy app/ --ignore-missing-imports

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-timeout

      - name: Run unit tests with coverage
        env:
          FLASK_ENV: testing
          SECRET_KEY: ci-test-secret-key
        run: |
          python -m pytest tests/ \
            -m "not slow" \
            --timeout=30 \
            --tb=short \
            -x \
            -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=70

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy and verify Render revision
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          RENDER_BASE_URL: ${{ vars.RENDER_BASE_URL || 'https://bookrank-ckml.onrender.com' }}
        run: |
          set -euo pipefail

          if [ -z "$RENDER_API_KEY" ]; then
            echo "ERROR: RENDER_API_KEY not configured."
            exit 1
          fi

          if [ -z "$RENDER_SERVICE_ID" ]; then
            echo "ERROR: RENDER_SERVICE_ID not configured."
            exit 1
          fi

          if [ -z "$RENDER_BASE_URL" ]; then
            echo "ERROR: RENDER_BASE_URL not configured."
            exit 1
          fi

          deploy_response="$(mktemp)"
          deploy_status_response="$(mktemp)"
          trap 'rm -f "$deploy_response" "$deploy_status_response"' EXIT

          curl --fail --show-error --silent --max-time 30 \
            -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            --data "{\"clearCache\":\"do_not_clear\",\"commitId\":\"${GITHUB_SHA}\"}" \
            -o "$deploy_response"

          DEPLOY_ID="$(python3 - "$deploy_response" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as response:
              print(json.load(response).get("id", ""))
          PY
          )"

          if [ -z "$DEPLOY_ID" ]; then
            echo "ERROR: Render deployment response did not include a deployment ID."
            exit 1
          fi

          for attempt in $(seq 1 20); do
            curl --fail --show-error --silent --max-time 30 \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${DEPLOY_ID}" \
              -o "$deploy_status_response"

            DEPLOY_STATUS="$(python3 - "$deploy_status_response" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as response:
              print(json.load(response).get("status", ""))
          PY
            )"

            if [ "$DEPLOY_STATUS" = "live" ]; then
              echo "Render deployment is live."
              break
            fi

            case "$DEPLOY_STATUS" in
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "ERROR: Render deployment entered terminal status: $DEPLOY_STATUS."
                exit 1
                ;;
            esac

            if [ "$attempt" -eq 20 ]; then
              echo "ERROR: Render deployment did not become live after 20 checks."
              exit 1
            fi

            echo "Render deployment status is ${DEPLOY_STATUS:-unknown}; retrying in 15 seconds."
            sleep 15
          done

          for attempt in $(seq 1 12); do
            if curl --fail --show-error --silent --max-time 30 \
              "$RENDER_BASE_URL/health/ready" -o /dev/null; then
              echo "Render deployment is ready."
              exit 0
            fi

            if [ "$attempt" -lt 12 ]; then
              echo "Render readiness check ${attempt}/12 failed; retrying in 15 seconds."
              sleep 15
            fi
          done

          echo "ERROR: Render deployment did not become ready after 12 checks."
          exit 1
