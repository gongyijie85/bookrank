name: Recover HuggingFace Space

on:
  workflow_dispatch:
    inputs:
      factory:
        description: Rebuild the Space from scratch (factory reboot)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  recover:
    name: Factory reboot and verify Space
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE_REPO: ${{ vars.HF_SPACE_REPO || 'Elvis85/bookrank' }}
      SPACE_URL: https://elvis85-bookrank.hf.space
    steps:
      - name: Check HuggingFace credentials
        run: |
          set -euo pipefail
          if [ -z "$HF_TOKEN" ]; then
            echo "ERROR: HF_TOKEN is not configured."
            exit 1
          fi
          echo "Space repo: ${HF_SPACE_REPO}"

      - name: Snapshot runtime and logs
        run: |
          set -euo pipefail
          mkdir -p artifacts
          curl --silent --show-error --max-time 20 -L \
            -H "Authorization: Bearer ${HF_TOKEN}" \
            "https://huggingface.co/api/spaces/${HF_SPACE_REPO}/runtime" \
            -o artifacts/runtime-before.json
          python3 - <<'PY'
          import json
          with open("artifacts/runtime-before.json", encoding="utf-8") as fh:
              runtime = json.load(fh)
          print(f"stage={runtime.get('stage')} sha={runtime.get('sha')}")
          PY
          curl --silent --show-error --max-time 20 -L \
            -H "Authorization: Bearer ${HF_TOKEN}" \
            "https://huggingface.co/api/spaces/${HF_SPACE_REPO}/logs/run" \
            -o artifacts/logs-before.txt \
            || echo "WARNING: could not fetch run logs before reboot."
          echo "Saved runtime and logs to artifacts (not printed; they may contain secrets)."

      - name: Reboot Space
        run: |
          set -euo pipefail
          FACTORY="${{ inputs.factory }}"
          QUERY=""
          if [ "$FACTORY" = "true" ]; then
            QUERY="?factory=true"
            echo "Triggering factory reboot for ${HF_SPACE_REPO}"
          else
            echo "Triggering ordinary restart for ${HF_SPACE_REPO}"
          fi

          HTTP_CODE="$(curl --silent --show-error --max-time 30 -L \
            -X POST "https://huggingface.co/api/spaces/${HF_SPACE_REPO}/restart${QUERY}" \
            -H "Authorization: Bearer ${HF_TOKEN}" \
            -o artifacts/restart-response.json \
            -w '%{http_code}')"
          echo "Restart HTTP ${HTTP_CODE}"
          cat artifacts/restart-response.json || true
          echo
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "ERROR: Space restart failed with HTTP ${HTTP_CODE}."
            exit 1
          fi

      - name: Wait until Space serves HTTP
        run: |
          set -euo pipefail
          DEADLINE=$((SECONDS + 900))
          LAST_STAGE=""
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            STAGE="$(curl --silent --show-error --max-time 20 -L \
              -H "Authorization: Bearer ${HF_TOKEN}" \
              "https://huggingface.co/api/spaces/${HF_SPACE_REPO}/runtime" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("stage",""))' \
              || true)"
            if [ "$STAGE" != "$LAST_STAGE" ]; then
              echo "Space stage: ${STAGE:-unknown}"
              LAST_STAGE="$STAGE"
            fi

            case "$STAGE" in
              RUNTIME_ERROR|BUILD_ERROR|CONFIG_ERROR|APP_FAILED)
                echo "ERROR: Space entered terminal stage ${STAGE}."
                curl --silent --show-error --max-time 20 -L \
                  -H "Authorization: Bearer ${HF_TOKEN}" \
                  "https://huggingface.co/api/spaces/${HF_SPACE_REPO}/logs/run" \
                  -o artifacts/logs-after-error.txt || true
                echo "Saved error logs to artifacts (not printed)."
                exit 1
                ;;
            esac

            if [ "$STAGE" = "RUNNING" ]; then
              if curl --fail --silent --show-error --max-time 20 \
                "${SPACE_URL}/health/ready" -o /dev/null; then
                echo "Space is serving /health/ready."
                curl --silent --show-error --max-time 20 \
                  "${SPACE_URL}/health/ready" || true
                echo
                if curl --fail --silent --show-error --max-time 45 \
                  "${SPACE_URL}/" -o /dev/null; then
                  echo "Space homepage also responded."
                else
                  echo "WARNING: homepage did not respond; health is up."
                fi
                exit 0
              fi
              echo "Stage is RUNNING but HTTP is not ready yet."
            fi

            sleep 20
          done

          echo "ERROR: Space did not become ready within 15 minutes."
          curl --silent --show-error --max-time 20 -L \
            -H "Authorization: Bearer ${HF_TOKEN}" \
            "https://huggingface.co/api/spaces/${HF_SPACE_REPO}/runtime" \
            -o artifacts/runtime-after.json || true
          curl --silent --show-error --max-time 20 -L \
            -H "Authorization: Bearer ${HF_TOKEN}" \
            "https://huggingface.co/api/spaces/${HF_SPACE_REPO}/logs/run" \
            -o artifacts/logs-after.txt || true
          echo "Saved post-timeout runtime and logs to artifacts (not printed)."
          exit 1

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hf-space-diagnostics
          path: artifacts
          if-no-files-found: ignore
