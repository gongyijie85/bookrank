name: Production Monitor

on:
  schedule:
    # GitHub scheduled workflows can be delayed under load; this is a five-minute
    # probe cadence, not an uptime-SLA substitute.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ready-and-latency:
    name: Check readiness and response time
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      RENDER_BASE_URL: ${{ vars.RENDER_BASE_URL || 'https://bookrank-ckml.onrender.com' }}
      PRODUCTION_ALERT_WEBHOOK_URL: ${{ secrets.PRODUCTION_ALERT_WEBHOOK_URL }}
      # 阈值来自 GitHub 仓库变量，未配置时回退到默认值（与 ci.yml 的 RENDER_BASE_URL 模式一致）
      READY_LATENCY_WARNING_SECONDS: ${{ vars.READY_LATENCY_WARNING_SECONDS || '3' }}
      READY_LATENCY_CRITICAL_SECONDS: ${{ vars.READY_LATENCY_CRITICAL_SECONDS || '10' }}
    steps:
      - name: Probe /health/ready
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          result="$(curl --silent --show-error --location --max-time 30 \
            --output /dev/null --write-out '%{http_code} %{time_total}' \
            "$RENDER_BASE_URL/health/ready" || true)"
          read -r status elapsed <<< "$result" || true
          status="${status:-000}"
          elapsed="${elapsed:-30}"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "elapsed=$elapsed" >> "$GITHUB_OUTPUT"
          echo "Ready probe HTTP ${status} in ${elapsed}s"

          if [[ "$status" != "200" ]]; then
            echo "state=critical" >> "$GITHUB_OUTPUT"
            echo "::error::Ready probe failed: HTTP ${status} in ${elapsed}s"
            exit 1
          fi

          if awk "BEGIN { exit !($elapsed > $READY_LATENCY_CRITICAL_SECONDS) }"; then
            echo "state=critical" >> "$GITHUB_OUTPUT"
            echo "::error::Ready probe critical latency: ${elapsed}s > ${READY_LATENCY_CRITICAL_SECONDS}s"
            exit 1
          fi

          if awk "BEGIN { exit !($elapsed > $READY_LATENCY_WARNING_SECONDS) }"; then
            echo "state=warning" >> "$GITHUB_OUTPUT"
            echo "::warning::Ready probe warning latency: ${elapsed}s > ${READY_LATENCY_WARNING_SECONDS}s"
          else
            echo "state=healthy" >> "$GITHUB_OUTPUT"
          fi

      # Notification is best-effort. A missing webhook or a down chat endpoint
      # must not turn a latency warning into "All jobs have failed".
      - name: Notify on warning or failure
        if: always() && steps.probe.outputs.state != 'healthy'
        continue-on-error: true
        shell: bash
        env:
          PROBE_STATE: ${{ steps.probe.outputs.state || 'critical' }}
          PROBE_STATUS: ${{ steps.probe.outputs.status || '000' }}
          PROBE_ELAPSED: ${{ steps.probe.outputs.elapsed || 'unknown' }}
        run: |
          set -euo pipefail
          if [[ -z "$PRODUCTION_ALERT_WEBHOOK_URL" ]]; then
            echo "::warning::PRODUCTION_ALERT_WEBHOOK_URL is not configured; skipping on-call notification."
            exit 0
          fi

          payload="$(python3 - <<'PY'
          import json
          import os

          print(json.dumps({
              "msg_type": "text",
              "content": {"text": (
                  f"[BookRank][{os.environ['PROBE_STATE']}] production readiness probe: "
                  f"HTTP {os.environ['PROBE_STATUS']}, "
                  f"{os.environ['PROBE_ELAPSED']}s. "
                  f"Run: {os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
              )},
          }))
          PY
          )"
          curl --fail --silent --show-error --max-time 15 \
            -H 'Content-Type: application/json' \
            --data "$payload" "$PRODUCTION_ALERT_WEBHOOK_URL"

  space-freshness:
    name: Check HuggingFace Space freshness
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SPACE_URL: ${{ vars.SPACE_URL || 'https://elvis85-bookrank.hf.space' }}
      HF_SPACE_REPO: ${{ vars.HF_SPACE_REPO || 'Elvis85/bookrank' }}
      PRODUCTION_ALERT_WEBHOOK_URL: ${{ secrets.PRODUCTION_ALERT_WEBHOOK_URL }}
      # deploy 本身要跑十几分钟（Render 校验通过后才推 Space），HF 再构建一次又要几分钟，
      # 所以同步落后于 main 在宽限窗内是正常的，不能告警。
      SPACE_STALE_GRACE_MINUTES: ${{ vars.SPACE_STALE_GRACE_MINUTES || '45' }}
      EXPECTED_MAIN_SHA: ${{ github.sha }}
    steps:
      - name: Probe Space build freshness and readiness
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          API="https://huggingface.co/api/spaces/${HF_SPACE_REPO}"
          # 公开 Space 上这三个接口无需 token，本作业因此不持任何凭据。
          curl --silent --show-error --max-time 25 "$API"              -o "$RUNNER_TEMP/space-meta.json"    || true
          curl --silent --show-error --max-time 25 "$API/runtime"      -o "$RUNNER_TEMP/space-runtime.json" || true
          curl --silent --show-error --max-time 25 "$API/commits/main" -o "$RUNNER_TEMP/space-commits.json" || true
          python3 <<'PY'
          import datetime
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          TERMINAL_STAGES = {'BUILD_ERROR', 'RUNTIME_ERROR', 'CONFIG_ERROR', 'APP_FAILED'}
          # 暂停中的 Space 没有"当前构建"可言，探活也只会把它冷启动。
          QUIET_STAGES = {'SLEEPING', 'PAUSED', 'STOPPED'}


          def read(name):
              try:
                  with open(os.path.join(os.environ['RUNNER_TEMP'], name), encoding='utf-8') as handle:
                      return json.load(handle)
              except Exception:
                  return None


          meta = read('space-meta.json')
          runtime = read('space-runtime.json')
          commits = read('space-commits.json')

          repo_sha = (meta or {}).get('sha') or ''
          build_sha = (runtime or {}).get('sha') or ''
          stage = (runtime or {}).get('stage') or 'UNKNOWN'
          grace = int(os.environ.get('SPACE_STALE_GRACE_MINUTES') or 45)
          space_url = os.environ['SPACE_URL']

          criticals = []
          warnings = []
          detail = [f'stage={stage}', f'repo={repo_sha[:8] or "?"}', f'build={build_sha[:8] or "?"}']

          if meta is None or runtime is None:
              criticals.append('Space 元数据接口不可读，无法判断构建状态')

          # Space 最新提交由 ci.yml 的同步步骤写成 "sync: main@<sha>"，据此还原同步进度。
          synced_main = ''
          age_minutes = None
          if isinstance(commits, list) and commits:
              head = commits[0]
              title = (head.get('title') or '').strip()
              match = re.match(r'sync: main@([0-9a-f]{7,40})', title)
              if match:
                  synced_main = match.group(1)
              elif title:
                  warnings.append(f'Space HEAD 不是 CI 同步提交（{title[:48]}）：有人在原地改 Space 仓库')
              try:
                  stamped = datetime.datetime.strptime(head['date'], '%Y-%m-%dT%H:%M:%S.%fZ')
                  age_minutes = (datetime.datetime.utcnow() - stamped).total_seconds() / 60.0
              except Exception:
                  warnings.append('无法解析 Space 最新提交时间，跳过陈旧判定')
          else:
              criticals.append('Space 提交历史接口不可读')

          health = 'skipped'
          if stage not in QUIET_STAGES:
              try:
                  with urllib.request.urlopen(f'{space_url}/health/ready', timeout=30) as response:
                      health = str(getattr(response, 'status', 200))
              except urllib.error.HTTPError as error:
                  health = str(error.code)
              except Exception as error:
                  health = f'{type(error).__name__}'
          detail.append(f'health={health}')

          if stage in TERMINAL_STAGES:
              criticals.append(f'Space 进入终态 {stage}')
          elif stage not in QUIET_STAGES and health != '200':
              criticals.append(f'Space /health/ready 返回 {health}')

          # 核心判据：CI 推上去的源码已经落库，但 HF 没有把新构建提升为运行版本。
          if repo_sha and build_sha and repo_sha != build_sha:
              label = 'Space 构建未提升到仓库 HEAD（源码已同步，HF 探活未通过）'
              if age_minutes is None or age_minutes > grace:
                  criticals.append(f'{label}: repo={repo_sha[:8]} build={build_sha[:8]}, {int(age_minutes or 0)}m')
              else:
                  warnings.append(f'{label}（构建窗口内，{int(age_minutes)}m < {grace}m）')

          # 第二判据：main 已经前进，Space 却还停在旧的同步点 —— 同步步骤没跑或没推上去。
          expected = os.environ.get('EXPECTED_MAIN_SHA') or ''
          if synced_main and expected and not expected.startswith(synced_main):
              label = 'Space 落后于 main（同步停滞）'
              if age_minutes is None or age_minutes > grace:
                  criticals.append(f'{label}: Space={synced_main[:8]} main={expected[:8]}, {int(age_minutes or 0)}m')
              else:
                  warnings.append(f'{label}（deploy 进行中，{int(age_minutes)}m < {grace}m）')

          state = 'critical' if criticals else ('warning' if warnings else 'healthy')
          summary = '; '.join(criticals or warnings or ['Space 构建与 main 一致'])
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f'state={state}\n')
              handle.write(f'status={health}\n')
              handle.write(f"message={summary}\n")
          print('Space freshness: ' + state + ' | ' + ' '.join(detail) + ' | ' + summary)

          for note in warnings:
              print(f'::warning::{note}')
          for fault in criticals:
              print(f'::error::{fault}')
          sys.exit(1 if criticals else 0)
          PY

      - name: Notify on warning or failure
        if: always() && steps.probe.outputs.state != 'healthy'
        continue-on-error: true
        shell: bash
        env:
          PROBE_STATE: ${{ steps.probe.outputs.state || 'critical' }}
          PROBE_MESSAGE: ${{ steps.probe.outputs.message || 'unknown' }}
        run: |
          set -euo pipefail
          if [[ -z "$PRODUCTION_ALERT_WEBHOOK_URL" ]]; then
            echo "::warning::PRODUCTION_ALERT_WEBHOOK_URL is not configured; skipping on-call notification."
            exit 0
          fi

          payload="$(python3 - <<'PY'
          import json
          import os

          print(json.dumps({
              "msg_type": "text",
              "content": {"text": (
                  f"[BookRank][space-{os.environ['PROBE_STATE']}] "
                  f"{os.environ['PROBE_MESSAGE']}. "
                  f"Run: {os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
              )},
          }))
          PY
          )"
          curl --fail --silent --show-error --max-time 15 \
            -H 'Content-Type: application/json' \
            --data "$payload" "$PRODUCTION_ALERT_WEBHOOK_URL"
