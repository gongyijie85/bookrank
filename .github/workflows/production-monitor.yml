name: Production Monitor

on:
  schedule:
    # GitHub scheduled workflows can be delayed under load; this is a five-minute
    # probe cadence, not an uptime-SLA substitute.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read # 仅用于查上一次运行的结论，做告警去重

jobs:
  ready-and-latency:
    name: Check readiness and response time
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      RENDER_BASE_URL: ${{ vars.RENDER_BASE_URL || 'https://bookrank-ckml.onrender.com' }}
      PRODUCTION_ALERT_WEBHOOK_URL: ${{ secrets.PRODUCTION_ALERT_WEBHOOK_URL }}
      # 阈值来自 GitHub 仓库变量，未配置时回退到默认值（与 ci.yml 的 RENDER_BASE_URL 模式一致）
      READY_LATENCY_WARNING_SECONDS: ${{ vars.READY_LATENCY_WARNING_SECONDS || '3' }}
      READY_LATENCY_CRITICAL_SECONDS: ${{ vars.READY_LATENCY_CRITICAL_SECONDS || '10' }}
    steps:
      - name: Probe /health/ready
        id: probe
        shell: bash
        run: |
          set -euo pipefail

          # 阈值必须是整数。旧写法把阈值直接内插进 awk 程序文本，配错成非数字时 awk 以
          # 语法错误退出（码非 0），`if` 判假 → 延迟告警永久静默绿灯，这是 fail-open。
          # 现在先校验：配置错本身就判 critical，并且要能送进告警通道。
          is_int() { [[ "$1" =~ ^[0-9]+$ ]]; }
          if ! is_int "$READY_LATENCY_WARNING_SECONDS" || ! is_int "$READY_LATENCY_CRITICAL_SECONDS"; then
            echo "state=critical" >> "$GITHUB_OUTPUT"
            echo "::error::延迟阈值必须是非负整数（vars.READY_LATENCY_WARNING_SECONDS=${READY_LATENCY_WARNING_SECONDS}, vars.READY_LATENCY_CRITICAL_SECONDS=${READY_LATENCY_CRITICAL_SECONDS}）"
            exit 1
          fi
          if (( READY_LATENCY_WARNING_SECONDS > READY_LATENCY_CRITICAL_SECONDS )); then
            echo "state=critical" >> "$GITHUB_OUTPUT"
            echo "::error::延迟阈值倒置：warning(${READY_LATENCY_WARNING_SECONDS}s) > critical(${READY_LATENCY_CRITICAL_SECONDS}s)"
            exit 1
          fi

          result="$(curl --silent --show-error --location --max-time 30 \
            --output /dev/null --write-out '%{http_code} %{time_total}' \
            "$RENDER_BASE_URL/health/ready" || true)"
          read -r status elapsed <<< "$result" || true
          status="${status:-000}"
          # curl 失败/被代理改写时 time_total 可能不是数字，兜底成 max-time 值而不是放行
          if [[ ! "$elapsed" =~ ^[0-9]+([.][0-9]+)?$ ]]; then elapsed=30; fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "elapsed=$elapsed" >> "$GITHUB_OUTPUT"
          echo "Ready probe HTTP ${status} in ${elapsed}s"

          if [[ "$status" != "200" ]]; then
            echo "state=critical" >> "$GITHUB_OUTPUT"
            echo "::error::Ready probe failed: HTTP ${status} in ${elapsed}s"
            exit 1
          fi

          if awk -v e="$elapsed" -v c="$READY_LATENCY_CRITICAL_SECONDS" 'BEGIN { exit !(e > c) }'; then
            echo "state=critical" >> "$GITHUB_OUTPUT"
            echo "::error::Ready probe critical latency: ${elapsed}s > ${READY_LATENCY_CRITICAL_SECONDS}s"
            exit 1
          fi

          if awk -v e="$elapsed" -v c="$READY_LATENCY_WARNING_SECONDS" 'BEGIN { exit !(e > c) }'; then
            echo "state=warning" >> "$GITHUB_OUTPUT"
            echo "::warning::Ready probe warning latency: ${elapsed}s > ${READY_LATENCY_WARNING_SECONDS}s"
          else
            echo "state=healthy" >> "$GITHUB_OUTPUT"
          fi

      # 只对 critical 推送：vars.READY_LATENCY_WARNING_SECONDS 默认 3s，而实测热态延迟就有
      # 1.07~6.4s，本工作流每 5 分钟一轮 —— warning 也推会让群里一天上百条，最终被人静音，
      # 等于把 critical 的送达率一起赔掉。warning 仍留 ::warning:: 注解，不进通道。
      # 持续故障只推第一次（与上一次已完成运行的结论比较）；查不到结论就照发，宁可多报不漏报。
      # 推送本身失败不会把作业从 critical 改成别的结论（continue-on-error），但一定会留下
      # 一条 ::error::，红叉上能直接看到"已判定但没通知到人"。
      - name: Notify on critical
        if: always() && steps.probe.outputs.state == 'critical'
        continue-on-error: true
        shell: bash
        env:
          MONITOR_JOB_NAME: Check readiness and response time
          PROBE_STATE: ${{ steps.probe.outputs.state || 'critical' }}
          PROBE_STATUS: ${{ steps.probe.outputs.status || '000' }}
          PROBE_ELAPSED: ${{ steps.probe.outputs.elapsed || 'unknown' }}
        run: |
          set -euo pipefail
          export PROBE_MESSAGE="[BookRank][${PROBE_STATE}] production readiness probe: HTTP ${PROBE_STATUS}, ${PROBE_ELAPSED}s"
          if [[ -z "${PRODUCTION_ALERT_WEBHOOK_URL:-}" ]]; then
            echo "::error::critical 已判定，但告警无法送达：仓库未配置 PRODUCTION_ALERT_WEBHOOK_URL secret。"
            exit 0
          fi

          # 文件名与作业名在此写死：Actions API 支持用工作流文件名寻址，本文件或作业 name 改名需同步这里。
          # 去重必须按"本作业"而不是整轮运行：ready-and-latency 与 space-freshness 是两个独立故障域，
          # 共用运行结论会让 readiness 先红顺带吞掉 Space 的第一条告警。
          prev_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/production-monitor.yml/runs?per_page=10" \
            --jq "[.workflow_runs[] | select(.id != ${GITHUB_RUN_ID} and .status == \"completed\")][0].id // empty" \
            2>/dev/null || echo '')"
          if [[ -n "$prev_run" ]]; then
            prev_job="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${prev_run}/jobs" \
              --jq ".jobs[] | select(.name == \"${MONITOR_JOB_NAME}\") | .conclusion" 2>/dev/null || echo '')"
            case "$prev_job" in
              failure | timed_out | cancelled)
                echo "上一轮运行（${prev_run}）本作业结论已是 ${prev_job}，按同一故障处理，跳过重复推送。"
                exit 0
                ;;
            esac
          fi

          payload="$(python3 - <<'PY'
          import json
          import os

          run_link = (
              f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
              f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          )
          print(json.dumps({
              "msg_type": "text",
              "content": {"text": os.environ['PROBE_MESSAGE'] + f". Run: {run_link}"},
          }))
          PY
          )"
          if ! curl --fail --silent --show-error --max-time 15 \
            -H 'Content-Type: application/json' \
            --data "$payload" "$PRODUCTION_ALERT_WEBHOOK_URL"; then
            echo "::error::告警推送失败（webhook 不可达），本轮 critical 未通知到值班。"
          fi

  space-freshness:
    name: Check HuggingFace Space freshness
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SPACE_URL: ${{ vars.SPACE_URL || 'https://elvis85-bookrank.hf.space' }}
      HF_SPACE_REPO: ${{ vars.HF_SPACE_REPO || 'Elvis85/bookrank' }}
      PRODUCTION_ALERT_WEBHOOK_URL: ${{ secrets.PRODUCTION_ALERT_WEBHOOK_URL }}
      # 同步提交推上去之后，HF 要先构建再等探活通过才会提升，正常要几分钟；
      # 超过这个窗还没提升，就是新构建起不来、Space 卡在旧版。
      SPACE_STALE_GRACE_MINUTES: ${{ vars.SPACE_STALE_GRACE_MINUTES || '45' }}
    steps:
      - name: Probe Space build freshness and readiness
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          API="https://huggingface.co/api/spaces/${HF_SPACE_REPO}"
          # --location 是必需的：仓库变量里的小写 elvis85/bookrank 会被 HF 307 跳转到
          # 规范大小写 Elvis85/bookrank，不跟随重定向就只会拿到一个空响应体。
          fetch() {
            local suffix="$1" name="$2" code
            code="$(curl --silent --show-error --location --max-time 25 \
              --write-out '%{http_code}' "$API$suffix" -o "$RUNNER_TEMP/$name" || echo 000)"
            printf '%s' "$code" > "$RUNNER_TEMP/$name.http"
            echo "GET $API$suffix -> HTTP $code"
          }
          # 公开 Space 上这三个接口无需 token，本作业因此不持任何凭据。
          fetch "" space-meta.json
          fetch /runtime space-runtime.json
          fetch /commits/main space-commits.json
          python3 <<'PY'
          import datetime
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          TERMINAL_STAGES = {'BUILD_ERROR', 'RUNTIME_ERROR', 'CONFIG_ERROR', 'APP_FAILED'}
          # 暂停中的 Space 没有"当前构建"可言，探活也只会把它冷启动。
          QUIET_STAGES = {'SLEEPING', 'PAUSED', 'STOPPED'}


          def read(name):
              try:
                  with open(os.path.join(os.environ['RUNNER_TEMP'], name), encoding='utf-8') as handle:
                      return json.load(handle)
              except Exception:
                  return None


          def http_code(name):
              try:
                  with open(os.path.join(os.environ['RUNNER_TEMP'], f'{name}.http'), encoding='utf-8') as handle:
                      return handle.read().strip() or '000'
              except Exception:
                  return 'n/a'


          def one_line(value, limit=60):
              # 进 GITHUB_OUTPUT 的 message= 与 ::warning:: 注解前必须单行化：
              # Space 提交标题由能向 Space 仓库提交的人控制，换行可伪造输出键或工作流命令。
              return ' '.join(str(value).split())[:limit]


          meta = read('space-meta.json')
          runtime = read('space-runtime.json')
          commits = read('space-commits.json')

          repo_sha = (meta or {}).get('sha') or ''
          build_sha = (runtime or {}).get('sha') or ''
          stage = (runtime or {}).get('stage') or 'UNKNOWN'
          grace = int(os.environ.get('SPACE_STALE_GRACE_MINUTES') or 45)
          space_url = os.environ['SPACE_URL']

          criticals = []
          warnings = []
          detail = [f'stage={stage}', f'repo={repo_sha[:8] or "?"}', f'build={build_sha[:8] or "?"}']

          # 宁可误报故障，也绝不 fail-open：状态码非 200、或响应体不是预期结构
          # （HF 会用 {"error": ...} 回答鉴权/限流），一律判故障。字段缺失会让下面所有
          # 陈旧判据静默跳过，把监控变成"永远绿灯"。
          unreadable = []
          if http_code('space-meta.json') != '200' or not (isinstance(meta, dict) and meta.get('sha')):
              unreadable.append(f'meta={http_code("space-meta.json")}')
          if http_code('space-runtime.json') != '200' or not (isinstance(runtime, dict) and runtime.get('stage')):
              unreadable.append(f'runtime={http_code("space-runtime.json")}')
          if http_code('space-commits.json') != '200' or not (isinstance(commits, list) and commits):
              unreadable.append(f'commits={http_code("space-commits.json")}')
          if unreadable:
              criticals.append('Space API 响应不可用（无法判定，按故障处理）: ' + ', '.join(unreadable))

          # Space 最新提交由 ci.yml 同步步骤写成 "sync: main@<sha>"，其提交时间即"推上去多久了"。
          age_minutes = None
          if isinstance(commits, list) and commits:
              head = commits[0]
              title = (head.get('title') or '').strip()
              if title and not title.startswith('sync: main@'):
                  warnings.append(f'Space HEAD 不是 CI 同步提交（{one_line(title, 48)}）：有人在原地改 Space 仓库')
              try:
                  stamped = datetime.datetime.strptime(head['date'], '%Y-%m-%dT%H:%M:%S.%fZ').replace(
                      tzinfo=datetime.timezone.utc
                  )
                  age_minutes = (
                      datetime.datetime.now(datetime.timezone.utc) - stamped
                  ).total_seconds() / 60.0
              except Exception:
                  warnings.append('无法解析 Space 最新提交时间，跳过陈旧判定')

          health = 'skipped'
          if stage not in QUIET_STAGES:
              try:
                  with urllib.request.urlopen(f'{space_url}/health/ready', timeout=30) as response:
                      health = str(getattr(response, 'status', 200))
              except urllib.error.HTTPError as error:
                  health = str(error.code)
              except Exception as error:
                  health = f'{type(error).__name__}'
          detail.append(f'health={health}')

          if stage in TERMINAL_STAGES:
              criticals.append(f'Space 进入终态 {stage}')
          elif stage not in QUIET_STAGES and health != '200':
              criticals.append(f'Space /health/ready 返回 {health}')

          # 核心判据：CI 推上去的源码已经落库，但 HF 没有把新构建提升为运行版本。
          if repo_sha and build_sha and repo_sha != build_sha:
              label = 'Space 构建未提升到仓库 HEAD（源码已同步，HF 探活未通过）'
              if age_minutes is None or age_minutes > grace:
                  criticals.append(f'{label}: repo={repo_sha[:8]} build={build_sha[:8]}, {int(age_minutes or 0)}m')
              else:
                  warnings.append(f'{label}（构建窗口内，{int(age_minutes)}m < {grace}m）')

          # 不检查"Space 是否落后于 main"：同步步骤只在运行时文件真有差异时才提交，
          # 于是只改 workflow/文档/测试的合并会合理地不产生新同步提交，任何与 main HEAD
          # 的 sha 比对都会在宽限窗后误报 critical。同步本身失败已由 deploy 变红覆盖。

          state = 'critical' if criticals else ('warning' if warnings else 'healthy')
          summary = '; '.join(criticals or warnings or ['Space 运行构建与其仓库 HEAD 一致'])
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f'state={state}\n')
              handle.write(f'status={health}\n')
              handle.write(f"message={summary}\n")
          print('Space freshness: ' + state + ' | ' + ' '.join(detail) + ' | ' + summary)

          for note in warnings:
              print(f'::warning::{note}')
          for fault in criticals:
              print(f'::error::{fault}')
          sys.exit(1 if criticals else 0)
          PY

      # 与 ready-and-latency 侧同一套送达策略：只推 critical、按本作业名做跃迁去重、
      # 通道缺失/推送失败都留 ::error::。Space 陈旧判定本身有 45 分钟宽限窗，
      # 窗口内的正常构建期只走 ::warning:: 注解。
      - name: Notify on critical
        if: always() && steps.probe.outputs.state == 'critical'
        continue-on-error: true
        shell: bash
        env:
          MONITOR_JOB_NAME: Check HuggingFace Space freshness
          PROBE_STATE: ${{ steps.probe.outputs.state || 'critical' }}
          PROBE_MESSAGE: ${{ steps.probe.outputs.message || 'unknown' }}
        run: |
          set -euo pipefail
          export PROBE_MESSAGE="[BookRank][space-${PROBE_STATE}] ${PROBE_MESSAGE}"
          if [[ -z "${PRODUCTION_ALERT_WEBHOOK_URL:-}" ]]; then
            echo "::error::critical 已判定，但告警无法送达：仓库未配置 PRODUCTION_ALERT_WEBHOOK_URL secret。"
            exit 0
          fi

          prev_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/production-monitor.yml/runs?per_page=10" \
            --jq "[.workflow_runs[] | select(.id != ${GITHUB_RUN_ID} and .status == \"completed\")][0].id // empty" \
            2>/dev/null || echo '')"
          if [[ -n "$prev_run" ]]; then
            prev_job="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${prev_run}/jobs" \
              --jq ".jobs[] | select(.name == \"${MONITOR_JOB_NAME}\") | .conclusion" 2>/dev/null || echo '')"
            case "$prev_job" in
              failure | timed_out | cancelled)
                echo "上一轮运行（${prev_run}）本作业结论已是 ${prev_job}，按同一故障处理，跳过重复推送。"
                exit 0
                ;;
            esac
          fi

          payload="$(python3 - <<'PY'
          import json
          import os

          run_link = (
              f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
              f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          )
          print(json.dumps({
              "msg_type": "text",
              "content": {"text": os.environ['PROBE_MESSAGE'] + f". Run: {run_link}"},
          }))
          PY
          )"
          if ! curl --fail --silent --show-error --max-time 15 \
            -H 'Content-Type: application/json' \
            --data "$payload" "$PRODUCTION_ALERT_WEBHOOK_URL"; then
            echo "::error::告警推送失败（webhook 不可达），本轮 critical 未通知到值班。"
          fi
