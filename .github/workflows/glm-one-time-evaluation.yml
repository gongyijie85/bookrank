name: Bounded GLM retry evaluation
on:
  push:
    branches:
      - codex/glm-4-7-flash-eval-20261111
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate at most three serial attempts
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, re, sys, time, urllib.error, urllib.request
          key = os.environ.get('ZHIPU_API_KEY', '')
          if not key:
              print(json.dumps({'result':'missing_key'})); sys.exit(1)
          payload = {'model':'glm-4.7-flash','messages':[{'role':'system','content':'Translate the English book title to simplified Chinese. Return only the translation.'},{'role':'user','content':'A COURT OF SPLINTERED HARMONY'}],'temperature':0.3,'max_tokens':512,'thinking':{'type':'disabled'}}
          for attempt in range(1, 4):
              if attempt > 1: time.sleep(12 if attempt == 2 else 24)
              request = urllib.request.Request('https://open.bigmodel.cn/api/paas/v4/chat/completions', data=json.dumps(payload).encode(), headers={'Authorization':'Bearer '+key,'Content-Type':'application/json'}, method='POST')
              started = time.monotonic()
              try:
                  with urllib.request.urlopen(request, timeout=55) as response:
                      result = json.load(response)
                      text = (result.get('choices') or [{}])[0].get('message', {}).get('content') or ''
                      valid = bool(re.search('[\u3400-\u9fff]', text))
                      print(json.dumps({'attempt':attempt,'result':'success' if valid else 'no_chinese_content','status':response.status,'elapsed_seconds':round(time.monotonic()-started,2),'model':result.get('model'),'translation':text[:100],'usage_total_tokens':(result.get('usage') or {}).get('total_tokens')}, ensure_ascii=True), flush=True)
                      sys.exit(0 if valid else 1)
              except urllib.error.HTTPError as error:
                  try: code = (json.load(error).get('error') or {}).get('code')
                  except (ValueError, AttributeError): code = None
                  print(json.dumps({'attempt':attempt,'result':'http_error','status':error.code,'code':code,'elapsed_seconds':round(time.monotonic()-started,2)}), flush=True)
                  if error.code != 429 or str(code) not in ('1302','1305'): sys.exit(1)
              except Exception as error:
                  print(json.dumps({'attempt':attempt,'result':'request_error','type':type(error).__name__,'elapsed_seconds':round(time.monotonic()-started,2)}), flush=True)
                  sys.exit(1)
          sys.exit(1)
          PY