name: Site Crawl Pipeline (observe + import)

# Daily ordered phases (#122 / #138):
#   wake → auto_sync (CRON_SECRET) → observe draft (no import secret) → import (BATCH_IMPORT_SECRET) → alert stub
# Fixture path demos the chain without live crawl / production display_primary GO.

on:
  schedule:
    - cron: '15 8 * * *' # after trigger-new-books-sync (08:00 UTC)
  workflow_dispatch:
    inputs:
      source_id:
        description: 'source_id for fixture observe/import demo'
        required: true
        default: 'harpercollins'
      skip_auto_sync:
        description: 'Skip CRON auto_sync trigger'
        type: boolean
        default: false
      skip_import:
        description: 'Skip import phase (observe only)'
        type: boolean
        default: false

concurrency:
  group: site-crawl-pipeline-${{ github.event.inputs.source_id || 'harpercollins' }}
  cancel-in-progress: false

jobs:
  wake-and-auto-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Wake Render with bounded readiness probes
        env:
          BASE_URL: ${{ vars.RENDER_BASE_URL || 'https://bookrank-ckml.onrender.com' }}
        run: |
          python scripts/workflow_http.py --policy read --path /health/ready \
            --timeout 20 --budget 75 --report artifacts/readiness.json

      - name: Submit existing daily auto_sync once (path C)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_auto_sync != true }}
        env:
          BASE_URL: ${{ vars.RENDER_BASE_URL || 'https://bookrank-ckml.onrender.com' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          python scripts/workflow_http.py --policy submit --path /api/cron/trigger-new-books-sync \
            --secret-env CRON_SECRET --timeout 60 --budget 60 --report artifacts/auto-sync.json

      - name: Preserve wake and submission outcome
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crawl-auto-sync-outcome
          path: artifacts/
          if-no-files-found: ignore

  observe:
    needs: wake-and-auto-sync
    # Observe is independent of an ambiguous remote auto_sync acknowledgement.
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Observe phase MUST NOT receive BATCH_IMPORT_SECRET
    env:
      SOURCE_ID: ${{ github.event.inputs.source_id || 'harpercollins' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Install app deps (no browser crawl secrets)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Assert import secret absent in observe job
        run: |
          python - <<'PY'
          import os
          from app.services.pipeline_draft import redact_secrets_from_env
          safe = redact_secrets_from_env(dict(os.environ))
          assert "BATCH_IMPORT_SECRET" not in safe
          assert "CRON_SECRET" not in safe
          print("observe env redaction ok")
          PY

      - name: Build fixture batch draft (write_enabled=false)
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from app.services.pipeline_draft import build_fixture_batch_draft

          source = os.environ["SOURCE_ID"]
          if source != "harpercollins":
              raise SystemExit(f"fixture demo only supports harpercollins, got {source}")
          draft = build_fixture_batch_draft(
              Path("tests/fixtures/publisher_observer/harpercollins/manifest.json"),
              run_date=datetime.now(timezone.utc).date().isoformat(),
              producer=f"gha_observe_{os.environ.get('GITHUB_RUN_ID', 'local')}",
          )
          out = Path("artifacts")
          out.mkdir(exist_ok=True)
          path = out / f"{source}-batch-draft.json"
          path.write_text(json.dumps(draft, ensure_ascii=False, indent=2), encoding="utf-8")
          print(path, "batch_id=", draft["batch_id"], "write_enabled=", draft["write_enabled"])
          PY

      - name: Upload batch draft artifact
        uses: actions/upload-artifact@v7
        with:
          name: batch-draft-${{ env.SOURCE_ID }}
          path: artifacts/*
          retention-days: 3

  import:
    needs: observe
    if: ${{ always() && !cancelled() && needs.observe.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.skip_import != true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Import phase holds BATCH_IMPORT_SECRET only — no Playwright browser secrets
    env:
      SOURCE_ID: ${{ github.event.inputs.source_id || 'harpercollins' }}
      BASE_URL: ${{ vars.RENDER_BASE_URL || 'https://bookrank-ckml.onrender.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Download batch draft
        uses: actions/download-artifact@v8
        with:
          name: batch-draft-${{ env.SOURCE_ID }}
          path: drafts

      - name: Import fixed batch with durable receipt replay
        env:
          BATCH_IMPORT_SECRET: ${{ secrets.BATCH_IMPORT_SECRET }}
        run: |
          set -euo pipefail
          drafts=(drafts/*-batch-draft.json)
          if [ "${#drafts[@]}" -ne 1 ] || [ ! -f "${drafts[0]}" ]; then
            echo "Expected exactly one immutable batch draft."
            exit 1
          fi
          # Same bytes and batch_id on every attempt. Receipt and book writes
          # are committed together by batch_import_service.import_batch.
          python scripts/workflow_http.py --policy batch --method POST \
            --path /api/new-books/import-batch --secret-env BATCH_IMPORT_SECRET \
            --body-file "${drafts[0]}" --timeout 45 --budget 160 \
            --report artifacts/import.json

      - name: Preserve import outcome
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crawl-import-outcome
          path: artifacts/
          if-no-files-found: ignore

  alert:
    needs: [wake-and-auto-sync, observe, import]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Alert phase uses ADMIN_SECRET only — never BATCH_IMPORT_SECRET (#139)
    env:
      SOURCE_ID: ${{ github.event.inputs.source_id || 'harpercollins' }}
      BASE_URL: ${{ vars.RENDER_BASE_URL || 'https://bookrank-ckml.onrender.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Sync source alert without masking original outcomes
        env:
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          AUTO_SYNC_RESULT: ${{ needs.wake-and-auto-sync.result }}
          OBSERVE_RESULT: ${{ needs.observe.result }}
          IMPORT_RESULT: ${{ needs.import.result }}
        run: |
          echo "auto_sync=$AUTO_SYNC_RESULT observe=$OBSERVE_RESULT import=$IMPORT_RESULT" >> "$GITHUB_STEP_SUMMARY"
          python scripts/workflow_http.py --policy notify --method POST \
            --path "/api/admin/new-books/source-alert/sync/${SOURCE_ID}" \
            --secret-env ADMIN_SECRET --header-name X-Admin-Secret \
            --timeout 20 --budget 20 --report artifacts/alert.json

      - name: Preserve alert delivery outcome
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crawl-alert-outcome
          path: artifacts/
          if-no-files-found: ignore
