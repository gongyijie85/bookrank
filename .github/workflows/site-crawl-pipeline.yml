name: Site Crawl Pipeline (observe + import)

# Daily ordered phases (#122 / #138):
#   wake → auto_sync (CRON_SECRET) → observe draft (no import secret) → import (BATCH_IMPORT_SECRET) → alert stub
# Fixture path demos the chain without live crawl / production display_primary GO.

on:
  schedule:
    - cron: '15 8 * * *' # after trigger-new-books-sync (08:00 UTC)
  workflow_dispatch:
    inputs:
      source_id:
        description: 'source_id for fixture observe/import demo'
        required: true
        default: 'harpercollins'
      skip_auto_sync:
        description: 'Skip CRON auto_sync trigger'
        type: boolean
        default: false
      skip_import:
        description: 'Skip import phase (observe only)'
        type: boolean
        default: false

concurrency:
  group: site-crawl-pipeline-${{ github.event.inputs.source_id || 'harpercollins' }}
  cancel-in-progress: false

jobs:
  wake-and-auto-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wake Render
        env:
          BASE_URL: ${{ vars.RENDER_BASE_URL || 'https://bookrank-ckml.onrender.com' }}
        run: |
          curl -s --max-time 30 "${BASE_URL}/api/health" > /dev/null || true
          sleep 15

      - name: Trigger existing daily auto_sync (path C)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_auto_sync != true }}
        env:
          BASE_URL: ${{ vars.RENDER_BASE_URL || 'https://bookrank-ckml.onrender.com' }}
        run: |
          set -e
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/sync.json -w '%{http_code}' --max-time 60 \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              "${BASE_URL}/api/cron/trigger-new-books-sync")
            echo "HTTP $code"
            cat /tmp/sync.json || true
            if [ "$code" = "200" ]; then exit 0; fi
            if [ "$code" = "401" ]; then echo "CRON_SECRET invalid"; exit 1; fi
            sleep 30
          done
          exit 1

  observe:
    needs: wake-and-auto-sync
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Observe phase MUST NOT receive BATCH_IMPORT_SECRET
    env:
      SOURCE_ID: ${{ github.event.inputs.source_id || 'harpercollins' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Install app deps (no browser crawl secrets)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Assert import secret absent in observe job
        run: |
          if [ -n "${{ secrets.BATCH_IMPORT_SECRET }}" ]; then
            # Secret may exist in repo but must not be exported into this job env
            true
          fi
          python - <<'PY'
          import os
          from app.services.pipeline_draft import redact_secrets_from_env
          safe = redact_secrets_from_env(dict(os.environ))
          assert "BATCH_IMPORT_SECRET" not in safe
          assert "CRON_SECRET" not in safe
          print("observe env redaction ok")
          PY

      - name: Build fixture batch draft (write_enabled=false)
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from app.services.pipeline_draft import build_fixture_batch_draft

          source = "${{ env.SOURCE_ID }}"
          if source != "harpercollins":
              raise SystemExit(f"fixture demo only supports harpercollins, got {source}")
          draft = build_fixture_batch_draft(
              Path("tests/fixtures/publisher_observer/harpercollins/manifest.json"),
              run_date=datetime.now(timezone.utc).date().isoformat(),
              producer=f"gha_observe_{os.environ.get('GITHUB_RUN_ID', 'local')}",
          )
          out = Path("artifacts")
          out.mkdir(exist_ok=True)
          path = out / f"{source}-batch-draft.json"
          path.write_text(json.dumps(draft, ensure_ascii=False, indent=2), encoding="utf-8")
          print(path, "batch_id=", draft["batch_id"], "write_enabled=", draft["write_enabled"])
          PY

      - name: Upload batch draft artifact
        uses: actions/upload-artifact@v4
        with:
          name: batch-draft-${{ env.SOURCE_ID }}
          path: artifacts/*
          retention-days: 3

  import:
    needs: observe
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_import != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Import phase holds BATCH_IMPORT_SECRET only — no Playwright browser secrets
    env:
      SOURCE_ID: ${{ github.event.inputs.source_id || 'harpercollins' }}
      BASE_URL: ${{ vars.RENDER_BASE_URL || 'https://bookrank-ckml.onrender.com' }}
    steps:
      - name: Download batch draft
        uses: actions/download-artifact@v4
        with:
          name: batch-draft-${{ env.SOURCE_ID }}
          path: drafts

      - name: Import batch (idempotent; retry transient only)
        env:
          BATCH_IMPORT_SECRET: ${{ secrets.BATCH_IMPORT_SECRET }}
        run: |
          set -e
          DRAFT=$(ls drafts/*-batch-draft.json | head -n1)
          echo "Using $DRAFT"
          # business 4xx: do not retry; 5xx/timeout: up to 3 tries
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/import.json -w '%{http_code}' --max-time 60 \
              -X POST "${BASE_URL}/api/new-books/import-batch" \
              -H "Authorization: Bearer ${BATCH_IMPORT_SECRET}" \
              -H "Content-Type: application/json" \
              --data-binary @"${DRAFT}")
            echo "HTTP $code attempt $i"
            cat /tmp/import.json || true
            if [ "$code" = "200" ]; then
              echo "import ok (applied or duplicate)"
              exit 0
            fi
            if [ "$code" = "401" ] || [ "$code" = "403" ] || [ "$code" = "400" ] || [ "$code" = "409" ]; then
              echo "business/auth failure, no retry"
              exit 1
            fi
            sleep 20
          done
          exit 1

  alert:
    needs: [observe, import]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Alert phase uses ADMIN_SECRET only — never BATCH_IMPORT_SECRET (#139)
    env:
      SOURCE_ID: ${{ github.event.inputs.source_id || 'harpercollins' }}
      BASE_URL: ${{ vars.RENDER_BASE_URL || 'https://bookrank-ckml.onrender.com' }}
    steps:
      - name: Sync source degraded/recovery GitHub issue
        env:
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: |
          set -e
          if [ -z "$ADMIN_SECRET" ]; then
            echo "ADMIN_SECRET not set; skip remote alert sync (app-side hooks still apply on import)."
            exit 0
          fi
          code=$(curl -s -o /tmp/alert.json -w '%{http_code}' --max-time 30 \
            -X POST "${BASE_URL}/api/admin/new-books/source-alert/sync/${SOURCE_ID}" \
            -H "X-Admin-Secret: ${ADMIN_SECRET}")
          echo "HTTP $code"
          cat /tmp/alert.json || true
          # do not fail the pipeline solely on alert transport; log for ops
          exit 0
