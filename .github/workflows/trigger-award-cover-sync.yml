name: Trigger Award Cover Sync

# Mutating cron GET: one submission only. Lost acknowledgements require verification.

on:
  schedule:
    # 每日 08:20 UTC，错开 08:00 的新书同步，避免同时打满外部 API 配额
    - cron: '20 8 * * *'
  workflow_dispatch:

concurrency:
  group: trigger-award-cover-sync
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Check readiness with bounded retries
        env:
          BASE_URL: ${{ vars.RENDER_BASE_URL || 'https://bookrank-ckml.onrender.com' }}
        run: |
          python scripts/workflow_http.py --policy read --path /health/ready \
            --timeout 20 --budget 75 --report artifacts/readiness.json

      - name: Submit award-cover-sync once
        env:
          BASE_URL: ${{ vars.RENDER_BASE_URL || 'https://bookrank-ckml.onrender.com' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          python scripts/workflow_http.py --policy submit --path /api/cron/sync-award-covers \
            --secret-env CRON_SECRET --timeout 60 --budget 60 \
            --report artifacts/award-cover-sync.json

      - name: Preserve operation outcome
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: award-cover-sync-outcome
          path: artifacts/
          if-no-files-found: ignore
