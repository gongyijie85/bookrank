name: Trigger Weekly Report

# Mutating cron GET: one submission only. Lost acknowledgements require verification.

on:
  schedule:
    # v0.9.46+：每周五/六/日 08:00 UTC 三次触发兜底
    # （GitHub Actions 免费层定时任务可能漏跑，周六/日两次重试）
    - cron: '0 8 * * 5,6,0'
  workflow_dispatch:

concurrency:
  group: trigger-weekly-report
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Check readiness with bounded retries
        env:
          BASE_URL: ${{ vars.RENDER_BASE_URL || 'https://bookrank-ckml.onrender.com' }}
        run: |
          python scripts/workflow_http.py --policy read --path /health/ready \
            --timeout 20 --budget 75 --report artifacts/readiness.json

      - name: Submit weekly-report once
        env:
          BASE_URL: ${{ vars.RENDER_BASE_URL || 'https://bookrank-ckml.onrender.com' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          python scripts/workflow_http.py --policy submit --path /api/cron/trigger-weekly-report \
            --secret-env CRON_SECRET --timeout 240 --budget 240 \
            --report artifacts/weekly-report.json

      - name: Preserve operation outcome
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: weekly-report-outcome
          path: artifacts/
          if-no-files-found: ignore
