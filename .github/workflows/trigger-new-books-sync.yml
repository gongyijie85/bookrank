name: Trigger New Books Sync

# Mutating cron GET: one submission only. Lost acknowledgements require verification.

on:
  schedule:
    # 每日 08:00 UTC 触发；GitHub Actions 免费层定时任务可能漏跑，
    # 次日 08:00 会再次触发，自我节流保证不会重复同步
    - cron: '0 8 * * *'
  workflow_dispatch:

concurrency:
  group: trigger-new-books-sync
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Check readiness with bounded retries
        env:
          BASE_URL: ${{ vars.RENDER_BASE_URL || 'https://bookrank-ckml.onrender.com' }}
        run: |
          python scripts/workflow_http.py --policy read --path /health/ready \
            --timeout 20 --budget 75 --report artifacts/readiness.json

      - name: Submit new-books-sync once
        env:
          BASE_URL: ${{ vars.RENDER_BASE_URL || 'https://bookrank-ckml.onrender.com' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          python scripts/workflow_http.py --policy submit --path /api/cron/trigger-new-books-sync \
            --secret-env CRON_SECRET --timeout 60 --budget 60 \
            --report artifacts/new-books-sync.json

      - name: Preserve operation outcome
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: new-books-sync-outcome
          path: artifacts/
          if-no-files-found: ignore
